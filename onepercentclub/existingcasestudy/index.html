<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Existing case study</title>
  <style>
    body {
      margin: 0;
      background: #eef5f0;
      color: #0f3d2c;
      font-family: Georgia, serif;
    }
    header {
      padding: 1.25rem 1.5rem;
      background: #0f3d2c;
    }
    header a {
      margin-right: 1rem;
      color: #fff;
      font-family: sans-serif;
      font-weight: 700;
      text-decoration: none;
    }
    main {
      max-width: 68rem;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      line-height: 1.55;
    }
    main h1 { margin-top: 0; }
    main table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-family: sans-serif;
      font-size: 0.92rem;
    }
    main th, main td {
      border: 1px solid #c5d9ce;
      padding: 0.55rem 0.7rem;
      text-align: left;
      vertical-align: top;
    }
    main th { background: #d7ebe1; }
    main a { color: #1f6b4a; }
    #status { font-family: sans-serif; color: #5c6f64; }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html">Projects</a>
    <a href="../">1% Club</a>
  </header>
  <main>
    <p id="status">Loading the case study…</p>
    <article id="doc" hidden></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script>
    marked.setOptions({ gfm: true });
    fetch("../../1percentclub/existing-case-study.md")
      .then(function (response) {
        if (!response.ok) throw new Error("Could not load existing-case-study.md");
        return response.text();
      })
      .then(function (markdown) {
        var doc = document.getElementById("doc");
        doc.innerHTML = marked.parse(markdown);
        doc.querySelectorAll("a").forEach(function (link) {
          link.setAttribute("target", "_blank");
          link.setAttribute("rel", "noopener noreferrer");
        });
        doc.hidden = false;
        document.getElementById("status").remove();
      })
      .catch(function (error) {
        document.getElementById("status").textContent = error.message + ". Open this page from the site root so the markdown file can load.";
      });
  </script>
</body>
</html>
