<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Initial plan</title>
  <style>
    body {
      margin: 0;
      background: #eef5f0;
      color: #0f3d2c;
      font-family: Georgia, serif;
    }
    header {
      padding: 1.25rem 1.5rem;
      background: #0f3d2c;
    }
    header a {
      margin-right: 1rem;
      color: #fff;
      font-family: sans-serif;
      font-weight: 700;
      text-decoration: none;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      line-height: 1.55;
    }
    main h1 { margin-top: 0; }
    main table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-family: sans-serif;
      font-size: 0.95rem;
    }
    main th, main td {
      border: 1px solid #c5d9ce;
      padding: 0.55rem 0.7rem;
      text-align: left;
      vertical-align: top;
    }
    main th { background: #d7ebe1; }
    main a { color: #1f6b4a; }
    main .mermaid { margin: 0.5rem 0 1.5rem; overflow-x: auto; }
    main .mermaid svg { max-width: 100%; height: auto; }
    main img { max-width: 100%; height: auto; margin: 0.5rem 0 1.25rem; }
    #doc { overflow-x: auto; }
    #status { font-family: sans-serif; color: #5c6f64; }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html">Projects</a>
    <a href="../">1% Club</a>
  </header>
  <main>
    <p id="status">Loading the plan…</p>
    <article id="doc" hidden></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script>
    marked.setOptions({ gfm: true });
    fetch("../reports/initial-plan.md")
      .then(function (response) {
        if (!response.ok) throw new Error("Could not load initial-plan.md");
        return response.text();
      })
      .then(function (markdown) {
        var doc = document.getElementById("doc");
        doc.innerHTML = marked.parse(markdown);
        doc.querySelectorAll("img").forEach(function (img) {
          var src = img.getAttribute("src") || "";
          if (src && src.indexOf("http") !== 0 && src.charAt(0) !== "/" && src.indexOf("data:") !== 0) {
            img.setAttribute("src", "../reports/" + src);
          }
        });
        doc.querySelectorAll("a").forEach(function (link) {
          var href = link.getAttribute("href") || "";
          if (href && href.indexOf("http") !== 0 && href.charAt(0) !== "/" && href.charAt(0) !== "#" && href.indexOf("mailto:") !== 0) {
            link.setAttribute("href", "../reports/" + href);
          }
          link.setAttribute("target", "_blank");
          link.setAttribute("rel", "noopener noreferrer");
        });
        var blocks = doc.querySelectorAll("code.language-mermaid");
        var draw = Promise.resolve();
        if (blocks.length) {
          draw = import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs").then(function (mod) {
            var mermaid = mod.default;
            mermaid.initialize({
              startOnLoad: false,
              theme: "neutral",
              securityLevel: "strict",
              fontFamily: "sans-serif",
              flowchart: { htmlLabels: false, useMaxWidth: true }
            });
            var nodes = [];
            blocks.forEach(function (block) {
              var holder = document.createElement("div");
              holder.className = "mermaid";
              holder.textContent = block.textContent;
              block.parentElement.replaceWith(holder);
              nodes.push(holder);
            });
            doc.hidden = false;
            return mermaid.run({ nodes: nodes });
          });
        }
        return draw.then(function () {
          doc.hidden = false;
          document.getElementById("status").remove();
        }).catch(function () {
          doc.hidden = false;
          document.getElementById("status").textContent = "The diagram could not be drawn. The rest of the plan is below.";
        });
      })
      .catch(function (error) {
        document.getElementById("status").textContent = error.message + ". Open this page from the site root so the markdown file can load.";
      });
  </script>
</body>
</html>
